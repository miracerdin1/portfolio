<title>Miraç Erdin</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#0a0c10;
    --surface:#12151c;
    --surface-2:#1a1e27;
    --line:#262b36;
    --text:#edf0f5;
    --text-dim:#9aa1b3;
    --text-faint:#5c6274;
    --accent:#ff6a39;
    --accent-2:#4dd6c4;
    --accent-soft:rgba(255,106,57,0.14);
    --font-display:'Fraunces',Georgia,serif;
    --font-body:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  html{scroll-behavior:smooth;background:var(--bg);}
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding-inline:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;}
  a{color:inherit;}
  h1,h2,h3{font-family:var(--font-display);font-weight:500;margin:0;text-wrap:balance;}
  p{margin:0;}
  ::selection{background:var(--accent);color:#0a0c10;}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px;}

  .wrap{max-width:1120px;margin-inline:auto;padding-inline:clamp(20px,5vw,48px);}
  section{scroll-margin-top:84px;}

  /* nav */
  .nav{
    position:sticky;top:0;z-index:50;
    background:rgba(10,12,16,0.72);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav-row{
    display:flex;align-items:center;justify-content:space-between;
    gap:1rem;flex-wrap:wrap;
    padding-block:14px;
  }
  .brand{
    font-family:var(--font-mono);font-size:0.95rem;font-weight:500;
    letter-spacing:0.02em;
    display:flex;align-items:center;gap:0.5em;
  }
  .brand-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
  .nav-links{display:flex;gap:1.75rem;list-style:none;margin:0;padding:0;flex-wrap:wrap;}
  .nav-links a{
    font-size:0.9rem;color:var(--text-dim);text-decoration:none;
    padding-block:4px;border-bottom:1px solid transparent;transition:color .15s,border-color .15s;
  }
  .nav-links a:hover{color:var(--text);border-color:var(--accent);}
  .nav-gh{
    display:inline-flex;align-items:center;gap:0.5em;
    font-size:0.85rem;font-family:var(--font-mono);
    color:var(--text);text-decoration:none;
    border:1px solid var(--line);border-radius:8px;
    padding:7px 12px;transition:border-color .15s,background .15s;
  }
  .nav-gh:hover{border-color:var(--accent);background:var(--accent-soft);}

  /* hero */
  .hero{position:relative;overflow:hidden;min-height:min(84vh,720px);display:flex;align-items:center;}
  .hero::before{
    content:'';position:absolute;inset:0;z-index:0;
    background:
      radial-gradient(ellipse 60% 50% at 30% 20%, rgba(255,106,57,0.16), transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 70%, rgba(77,214,196,0.10), transparent 60%);
  }
  .hero-canvas-mount{position:absolute;inset:0;z-index:1;}
  .hero-canvas-mount canvas{display:block;width:100%;height:100%;}
  .hero-inner{position:relative;z-index:2;padding-block:clamp(64px,10vw,96px);}
  .eyebrow{
    font-family:var(--font-mono);font-size:0.8rem;color:var(--accent-2);
    letter-spacing:0.12em;text-transform:uppercase;margin-bottom:1.1rem;
    display:flex;align-items:center;gap:0.6em;
  }
  .eyebrow::before{content:'';width:22px;height:1px;background:var(--accent-2);}
  .hero h1{font-size:clamp(2.6rem,7vw,4.6rem);letter-spacing:-0.01em;}
  .hero-lede{
    font-size:clamp(1.05rem,2vw,1.25rem);color:var(--text-dim);
    max-width:42em;margin-top:1.25rem;font-weight:400;
  }
  .hero-cta{display:flex;gap:0.9rem;flex-wrap:wrap;margin-top:2.1rem;}
  .btn{
    display:inline-flex;align-items:center;gap:0.5em;
    font-family:var(--font-body);font-weight:600;font-size:0.95rem;
    padding:0.8em 1.4em;border-radius:9px;text-decoration:none;
    transition:transform .15s,box-shadow .15s,border-color .15s,background .15s;
    border:1px solid transparent;cursor:pointer;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{background:var(--accent);color:#0a0c10;box-shadow:0 6px 20px -8px rgba(255,106,57,0.6);}
  .btn-primary:hover{box-shadow:0 10px 26px -8px rgba(255,106,57,0.75);}
  .btn-ghost{border-color:var(--line);color:var(--text);}
  .btn-ghost:hover{border-color:var(--accent-2);background:rgba(77,214,196,0.08);}
  .hero-stats{
    display:flex;gap:clamp(1.5rem,4vw,3rem);flex-wrap:wrap;
    margin-top:clamp(2.5rem,6vw,3.5rem);
    padding-top:1.75rem;border-top:1px solid var(--line);
  }
  .stat-num{
    font-family:var(--font-mono);font-size:1.5rem;color:var(--text);
    font-variant-numeric:tabular-nums;
  }
  .stat-label{font-size:0.82rem;color:var(--text-faint);margin-top:0.2rem;}

  /* section headings */
  .section-head{margin-bottom:clamp(2rem,5vw,3rem);}
  .section-kicker{
    font-family:var(--font-mono);font-size:0.78rem;color:var(--accent);
    letter-spacing:0.1em;text-transform:uppercase;margin-bottom:0.7rem;
  }
  .section-head h2{font-size:clamp(1.7rem,4vw,2.3rem);}

  /* about */
  .about{padding-block:clamp(64px,10vw,110px);border-top:1px solid var(--line);}
  .about-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(2rem,5vw,4rem);align-items:start;}
  .about-body p{color:var(--text-dim);font-size:1.05rem;max-width:52em;}
  .about-body p + p{margin-top:1.1rem;}
  .about-body strong{color:var(--text);font-weight:600;}
  .panel{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:1.5rem;
  }
  .panel-title{
    font-family:var(--font-mono);font-size:0.78rem;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:0.08em;margin-bottom:1rem;
  }
  .panel-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0.8rem;}
  .panel-list li{
    display:flex;justify-content:space-between;gap:1rem;
    font-size:0.92rem;color:var(--text-dim);
    padding-bottom:0.8rem;border-bottom:1px solid var(--line);
  }
  .panel-list li:last-child{border-bottom:none;padding-bottom:0;}
  .panel-list span:first-child{color:var(--text);}
  @media (max-width:820px){.about-grid{grid-template-columns:1fr;}}

  /* projects */
  .projects{padding-block:clamp(64px,10vw,110px);border-top:1px solid var(--line);}
  .project-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:1.25rem;
  }
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:1.6rem;display:flex;flex-direction:column;gap:0.9rem;
    transition:border-color .18s,transform .18s,background .18s;
  }
  .card:hover{border-color:var(--accent);transform:translateY(-3px);background:var(--surface-2);}
  .card-tag{
    font-family:var(--font-mono);font-size:0.72rem;color:var(--accent-2);
    text-transform:uppercase;letter-spacing:0.08em;
  }
  .card h3{font-size:1.25rem;font-weight:600;font-family:var(--font-body);}
  .card p{color:var(--text-dim);font-size:0.94rem;flex:1;}
  .stack-row{display:flex;flex-wrap:wrap;gap:0.4rem;}
  .pill{
    font-family:var(--font-mono);font-size:0.72rem;color:var(--text-dim);
    background:var(--surface-2);border:1px solid var(--line);
    padding:0.3em 0.65em;border-radius:999px;
  }
  .card-links{display:flex;gap:1rem;flex-wrap:wrap;margin-top:0.2rem;}
  .card-links a{
    font-size:0.86rem;font-weight:600;color:var(--text);text-decoration:none;
    display:inline-flex;align-items:center;gap:0.35em;border-bottom:1px solid var(--accent);
    padding-bottom:1px;
  }
  .card-links a:hover{color:var(--accent);}

  /* skills */
  .skills{padding-block:clamp(64px,10vw,110px);border-top:1px solid var(--line);}
  .skill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:2rem;}
  .skill-group-title{
    font-family:var(--font-mono);font-size:0.82rem;color:var(--text);
    margin-bottom:0.9rem;padding-bottom:0.6rem;border-bottom:1px solid var(--line);
  }
  .skill-tags{display:flex;flex-wrap:wrap;gap:0.5rem;}

  /* practice projects */
  .practice{padding-block:clamp(48px,8vw,80px);border-top:1px solid var(--line);}
  .practice-lede{color:var(--text-dim);max-width:46em;margin-bottom:1.5rem;}
  .practice-grid{display:flex;flex-wrap:wrap;gap:0.55rem;}
  .pill-link{
    font-family:var(--font-mono);font-size:0.78rem;color:var(--text-dim);
    background:var(--surface);border:1px solid var(--line);
    padding:0.5em 0.85em;border-radius:999px;text-decoration:none;
    transition:border-color .15s,color .15s,background .15s;
  }
  .pill-link:hover{border-color:var(--accent); color:var(--text); background:var(--accent-soft);}

  /* footer */
  .footer{
    padding-block:clamp(56px,9vw,90px);border-top:1px solid var(--line);
    text-align:center;
  }
  .footer h2{font-size:clamp(1.8rem,5vw,2.6rem);max-width:16em;margin-inline:auto;}
  .footer-lede{color:var(--text-dim);margin-top:0.9rem;}
  .footer-cta{display:flex;justify-content:center;gap:0.9rem;flex-wrap:wrap;margin-top:2rem;}
  .footer-fine{
    margin-top:3.5rem;padding-top:1.5rem;border-top:1px solid var(--line);
    font-size:0.82rem;color:var(--text-faint);font-family:var(--font-mono);
    display:flex;justify-content:center;gap:0.5em;flex-wrap:wrap;
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:0.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
      scroll-behavior:auto !important;
    }
  }
</style>

  function useThreeScene(mountRef){
    useEffect(function(){
      var mount = mountRef.current;
      if(!mount || !window.THREE) return;

      var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var THREE = window.THREE;

      var width = mount.clientWidth, height = mount.clientHeight;
      var scene = new THREE.Scene();
      var camera = new THREE.PerspectiveCamera(55, width/height, 0.1, 100);
      camera.position.set(0,0,8);

      var renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(width, height);
      mount.appendChild(renderer.domElement);

      var isMobile = width < 640;
      var count = isMobile ? 110 : 240;

      var positions = new Float32Array(count*3);
      var baseY = new Float32Array(count);
      var phase = new Float32Array(count);
      var colors = new Float32Array(count*3);
      var cA = new THREE.Color(0xff6a39);
      var cB = new THREE.Color(0x4dd6c4);
      var tmp = new THREE.Color();

      for(var i=0;i<count;i++){
        var x = (Math.random()-0.5) * 15;
        var y = (Math.random()-0.5) * 8.5;
        var z = (Math.random()-0.5) * 7 - 1;
        positions[i*3]=x; positions[i*3+1]=y; positions[i*3+2]=z;
        baseY[i]=y; phase[i]=Math.random()*Math.PI*2;
        tmp.copy(cA).lerp(cB, Math.random());
        colors[i*3]=tmp.r; colors[i*3+1]=tmp.g; colors[i*3+2]=tmp.b;
      }

      var pointsGeo = new THREE.BufferGeometry();
      pointsGeo.setAttribute("position", new THREE.BufferAttribute(positions,3));
      pointsGeo.setAttribute("color", new THREE.BufferAttribute(colors,3));

      function makeSprite(){
        var size=64;
        var c=document.createElement("canvas");
        c.width=size;c.height=size;
        var ctx=c.getContext("2d");
        var g=ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
        g.addColorStop(0,"rgba(255,255,255,1)");
        g.addColorStop(0.45,"rgba(255,255,255,0.55)");
        g.addColorStop(1,"rgba(255,255,255,0)");
        ctx.fillStyle=g;
        ctx.fillRect(0,0,size,size);
        return new THREE.CanvasTexture(c);
      }

      var pointsMat = new THREE.PointsMaterial({
        size: isMobile ? 0.16 : 0.14,
        map: makeSprite(),
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      var points = new THREE.Points(pointsGeo, pointsMat);

      var linePositions = [];
      var threshold = 2.4;
      for(var a=0; a<count; a++){
        for(var b=a+1; b<count; b++){
          var dx=positions[a*3]-positions[b*3];
          var dy=positions[a*3+1]-positions[b*3+1];
          var dz=positions[a*3+2]-positions[b*3+2];
          var d=Math.sqrt(dx*dx+dy*dy+dz*dz);
          if(d<threshold){
            linePositions.push(positions[a*3],positions[a*3+1],positions[a*3+2]);
            linePositions.push(positions[b*3],positions[b*3+1],positions[b*3+2]);
          }
        }
      }
      var lineGeo = new THREE.BufferGeometry();
      lineGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(linePositions),3));
      var lineMat = new THREE.LineBasicMaterial({color:0x5c6274, transparent:true, opacity:0.18});
      var lines = new THREE.LineSegments(lineGeo, lineMat);

      var group = new THREE.Group();
      group.add(lines);
      group.add(points);
      group.rotation.x = 0.15;
      scene.add(group);

      var targetRotX = group.rotation.x, targetRotY = 0;
      function onPointerMove(e){
        var rect = mount.getBoundingClientRect();
        var px = ((e.clientX - rect.left)/rect.width)*2 - 1;
        var py = ((e.clientY - rect.top)/rect.height)*2 - 1;
        targetRotY = px * 0.35;
        targetRotX = 0.15 + py * 0.18;
      }
      if(!reduced) mount.addEventListener("pointermove", onPointerMove);

      var raf = null, t0 = performance.now();

      function render(now){
        var t = (now - t0)/1000;
        var posAttr = pointsGeo.attributes.position;
        for(var i=0;i<count;i++){
          posAttr.array[i*3+1] = baseY[i] + Math.sin(t*0.6 + phase[i])*0.15;
        }
        posAttr.needsUpdate = true;

        group.rotation.y += (targetRotY - group.rotation.y) * 0.04;
        group.rotation.x += (targetRotX - group.rotation.x) * 0.04;
        group.rotation.y += 0.0009;

        renderer.render(scene, camera);
        if(!reduced) raf = requestAnimationFrame(render);
      }
      render(t0);
      if(reduced){
        renderer.render(scene, camera);
      }

      function onResize(){
        var w = mount.clientWidth, hgt = mount.clientHeight;
        camera.aspect = w/hgt;
        camera.updateProjectionMatrix();
        renderer.setSize(w,hgt);
      }
      window.addEventListener("resize", onResize);

      return function cleanup(){
        if(raf) cancelAnimationFrame(raf);
        window.removeEventListener("resize", onResize);
        if(!reduced) mount.removeEventListener("pointermove", onPointerMove);
        pointsGeo.dispose(); lineGeo.dispose();
        pointsMat.dispose(); lineMat.dispose();
        renderer.dispose();
        if(mount.contains(renderer.domElement)) mount.removeChild(renderer.domElement);
      };
    }, [mountRef]);
  }
